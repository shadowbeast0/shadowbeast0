name: Neon cards
on:
  # redraw every day, on demand, and whenever the drawing script changes
  schedule: [{ cron: "30 0 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw stats, streak and language cards
        env:
          # the existing METRICS_TOKEN also counts private contributions; falls back to the built-in token
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: python scripts/cards.py shadowbeast0
      - name: Commit the cards if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          if ! git diff --cached --quiet; then
            git commit -m "Update neon cards [skip ci]"
            git pull --rebase
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: shadowbeast0
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#FF2E88&color_dots=#161b22,#2b1a4f,#5b2a8a,#a43fd0,#ff2e88
      - name: Publish it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
