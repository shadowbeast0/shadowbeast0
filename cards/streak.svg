<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" role="img" aria-label="STREAK">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140A26"/><stop offset="1" stop-color="#07040F"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22F0FF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22F0FF"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#ffffff" opacity=".05"/></pattern>
</defs>
<style>
  .t{font:900 italic 19px 'Segoe UI Black','Arial Black','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;letter-spacing:1.5px;fill:#fff}
  .k{font:900 64px 'Yu Gothic','Noto Sans JP','Hiragino Sans',sans-serif;fill:none;stroke:#8B5CF6;stroke-opacity:.28;stroke-width:1.4}
  .l{font:600 12.5px 'Cascadia Code','Fira Code',Consolas,'SF Mono',monospace;fill:#B8AEDC}
  .v{font:900 italic 18px 'Segoe UI Black','Arial Black','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#fff}
  .s{font:600 11px 'Cascadia Code','Fira Code',Consolas,'SF Mono',monospace;fill:#7E74A6}
  .grow{animation:grow 1.4s cubic-bezier(.2,.9,.2,1) both}
  .fade{animation:fade .8s ease-out both}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .scan{animation:scan 4s linear infinite}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}}
  @keyframes pulse{50%{opacity:.45}}
  @keyframes scan{from{transform:translateX(-495px)}to{transform:translateX(495px)}}
</style>
<rect x="2" y="2" width="491" height="211" rx="14" fill="url(#bg)"/>
<rect x="2" y="2" width="491" height="211" rx="14" fill="url(#dots)"/>
<rect class="scan" x="0" y="2" width="70" height="211" fill="#fff" opacity=".035"/>
<text class="k" x="417" y="70">炎</text>
<rect x="2" y="2" width="491" height="211" rx="14" fill="none" stroke="url(#edge)" stroke-width="2.5" filter="url(#glow)"/>
<text class="t" x="24" y="38">STREAK</text>
<rect x="24" y="46" width="64" height="3" rx="1.5" fill="#22F0FF" filter="url(#glow)"/>
<g class="fade" style="animation-delay:0.00s"><circle cx="92" cy="122" r="40" fill="none" stroke="#22F0FF" stroke-opacity=".18" stroke-width="7"/><circle class="pulse" cx="92" cy="122" r="40" fill="none" stroke="#22F0FF" stroke-width="3.5" stroke-dasharray="190 62" transform="rotate(-90 92 122)" filter="url(#glow)"/>
  <text x="92" y="131" text-anchor="middle" font-weight="900" font-style="italic" font-size="26" fill="#fff" font-family="'Segoe UI Black','Arial Black','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif">276</text>
  <text class="l" x="92" y="186" text-anchor="middle" fill="#22F0FF">Contributions</text>
  <text class="s" x="92" y="203" text-anchor="middle">since Nov 2025</text>
</g><g class="fade" style="animation-delay:0.15s"><circle cx="248" cy="122" r="40" fill="none" stroke="#FF2E88" stroke-opacity=".18" stroke-width="7"/><circle class="pulse" cx="248" cy="122" r="40" fill="none" stroke="#FF2E88" stroke-width="3.5" stroke-dasharray="190 62" transform="rotate(-90 248 122)" filter="url(#glow)"/><text x="248" y="76" text-anchor="middle" font-size="18" class="pulse">🔥</text>
  <text x="248" y="131" text-anchor="middle" font-weight="900" font-style="italic" font-size="26" fill="#fff" font-family="'Segoe UI Black','Arial Black','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif">1</text>
  <text class="l" x="248" y="186" text-anchor="middle" fill="#FF2E88">Current streak</text>
  <text class="s" x="248" y="203" text-anchor="middle">days in a row</text>
</g><g class="fade" style="animation-delay:0.30s"><circle cx="404" cy="122" r="40" fill="none" stroke="#FFD60A" stroke-opacity=".18" stroke-width="7"/><circle class="pulse" cx="404" cy="122" r="40" fill="none" stroke="#FFD60A" stroke-width="3.5" stroke-dasharray="190 62" transform="rotate(-90 404 122)" filter="url(#glow)"/>
  <text x="404" y="131" text-anchor="middle" font-weight="900" font-style="italic" font-size="26" fill="#fff" font-family="'Segoe UI Black','Arial Black','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif">5</text>
  <text class="l" x="404" y="186" text-anchor="middle" fill="#FFD60A">Longest streak</text>
  <text class="s" x="404" y="203" text-anchor="middle">days, past year</text>
</g>
</svg>