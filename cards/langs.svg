  <circle cx="31" cy="104" r="6" fill="#DA5B0B" filter="url(#glow)"/>
  <text class="l" x="46" y="108" fill="#E9E4FF">Jupyter Notebook</text>
  <text class="s" x="234" y="108" text-anchor="end">30.8%</text>
</g><g class="fade" style="animation-delay:0.50s">
  <circle cx="261" cy="104" r="6" fill="#f34b7d" filter="url(#glow)"/>
  <text class="l" x="276" y="108" fill="#E9E4FF">C++</text>
