</g><g class="fade" style="animation-delay:0.60s">
  <circle cx="31" cy="138" r="6" fill="#3572A5" filter="url(#glow)"/>
  <text class="l" x="46" y="142" fill="#E9E4FF">Python</text>
  <text class="s" x="234" y="142" text-anchor="end">14.3%</text>
</g><g class="fade" style="animation-delay:0.70s">
  <circle cx="261" cy="138" r="6" fill="#3178c6" filter="url(#glow)"/>
  <text class="l" x="276" y="142" fill="#E9E4FF">TypeScript</text>
  <text class="s" x="464" y="142" text-anchor="end">11.4%</text>
</g><g class="fade" style="animation-delay:0.80s">
